# CrowdWise — local development stack.
#
#   cp .env.example .env
#   docker compose up --build
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python seed.py
#
# Every service reads its configuration from .env, so switching a provider (demo
# payments to real Razorpay, mock AI to a Gemma endpoint, the simulated ledger to
# the Hardhat node) is a config change, never a code change.

name: crowdwise

services:
  postgres:
    image: postgres:16-alpine
    container_name: crowdwise-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crowdwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowdwise}
      POSTGRES_DB: ${POSTGRES_DB:-crowdwise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crowdwise} -d ${POSTGRES_DB:-crowdwise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  blockchain:
    build:
      context: .
      dockerfile: infrastructure/docker/blockchain.Dockerfile
    container_name: crowdwise-blockchain
    ports:
      - "8545:8545"
    volumes:
      # The host reads the deployed contract address from here.
      - ./blockchain/deployments:/app/deployments
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: crowdwise-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Container-internal hostnames override whatever .env says for localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crowdwise}:${POSTGRES_PASSWORD:-crowdwise}@postgres:5432/${POSTGRES_DB:-crowdwise}
      BLOCKCHAIN_RPC_URL: http://blockchain:8545
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_LOCAL_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: crowdwise-worker
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crowdwise}:${POSTGRES_PASSWORD:-crowdwise}@postgres:5432/${POSTGRES_DB:-crowdwise}
      BLOCKCHAIN_RPC_URL: http://blockchain:8545
      STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - backend_storage:/app/storage
    # Sentiment classification, deadline processing, governance close and
    # blockchain retries. The API also runs these in-process; a separate worker
    # keeps that work off the request path under load.
    command: ["python", "-m", "app.workers.scheduler"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-true}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    container_name: crowdwise-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
