[alembic]
script_location = alembic

# Name migration files by date and slug instead of the default hex revision id,
# so `ls versions/` reads as a changelog. The revision ids inside the files are
# unchanged — Alembic identifies revisions by their contents, not the filename.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally empty: the URL comes from DATABASE_URL at
# runtime (alembic/env.py), so no connection string ever lives in source.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
